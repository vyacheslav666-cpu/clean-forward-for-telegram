name: Feature request
description: Предложить улучшение для обсуждения
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Опишите задачу и риски. Предложение не означает включение функции в roadmap.
  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какую пользовательскую проблему нужно решить?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Безопасность и приватность
      description: Как предложение сохраняет ручную отправку и не раскрывает данные Telegram?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: В предложении нет реальных сообщений, названий чатов, peerId или данных сессии.
          required: true
